# Goal: build the image for devboard frontend and push to docker hub
name: ci

on: 
 push: 
  branches: [master]

jobs:

 code-lint:
  runs-on: ubuntu-latest
  steps:
    - name: checkout code
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
       node-version: '22' # Specifying your runtime environment
       cache: 'npm'       # Caches node_modules for speedier subsequent runs

    - name: Install Dependencies
      run: npm ci

    - name: Execute Linter Script
      run: npm run lint
    
 build-and-push:
  needs: [code-lint]
  runs-on: ubuntu-latest
  steps:
    - name: checkout code
      uses: actions/checkout@v7
      
    - name: Docker setup [login]
      uses: docker/login-action@v4
      with:
       username: ${{ vars.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}
       
    - name: docker build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master:latest
    
 
